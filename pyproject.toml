[project]
name = "w17-mlops-tracks"
version = "0.1.0"
description = "Week 17 MLOps: Track A (Data Science Churn Pipeline) and Track B (Agentic AI MLOps)"
readme = "README.md"
authors = [
    { name = "Viraj Sawad", email = "virajsawad1021@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.15.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "evidently>=0.4.30",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
